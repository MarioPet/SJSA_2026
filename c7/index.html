<html>
    <head>
        <title>Promises and Fetch</title>
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0px;
                background-color: #c7ecee;
            }

            .gallery {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 20px;
                width: 70vw;
                margin: 50px auto;
            }

            .gallery img {
                width: 100%;
                cursor: pointer;
                transition: all 0.2s ease-in-out;
            }

            .gallery img:hover {
                transform: scale(1.1);
            }

            .full-screen {
                width: 100%;
                height: 100%;
                position: fixed;
                z-index: 1;
                left: 0;
                top: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                visibility: hidden;
                transition: all 0.2s ease-in-out;
            }

            .full-screen:before {
                content: "";
                position: absolute;
                width: 100%;
                height: 100%;
                background-color: #000000c9;
                backdrop-filter: blur(10px);
            }

            .image-holder {
                position: relative;
            }

            .close-photo {
                position: fixed;
                top: 40px;
                right: 40px;
                background-color: #fff;
                border: none;
                width: 30px;
                height: 30px;
                border-radius: 50%;
                cursor: pointer;
                transition: all 0.2s ease-in-out;
                font-size: 18px;
            }

            .close-photo:hover {
                transform: scale(1.1);
            }
            
            .show {
                opacity: 1;
                visibility: visible;
            }

            .target-img {
                width: 70vw;
            }
        </style>
    </head>
